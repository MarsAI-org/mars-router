name: Publish CLI to npm

# Publishes the `mars-router` CLI package to npm. Runs on every v* tag (matching
# the Docker release) or manually. Requires an NPM_TOKEN repository secret with
# publish access to the `mars-router` package; without it the job is skipped
# (green) instead of failing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "npm publish --dry-run (no upload)"
        required: false
        default: false
        type: boolean

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish mars-router
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Skip when NPM_TOKEN is not configured
        id: gate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN secret not set — skipping npm publish."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure the tag matches cli/package.json
        if: steps.gate.outputs.configured == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./cli/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match cli/package.json version $pkg"
            exit 1
          fi

      # The CLI build compiles the Next.js app (needs root node_modules), then
      # bundles ./cli. Install root deps first, then run the CLI publish.
      - name: Install root dependencies
        if: steps.gate.outputs.configured == 'true'
        run: npm install --no-audit --no-fund

      - name: Install CLI dependencies
        if: steps.gate.outputs.configured == 'true'
        run: npm --prefix cli install --no-audit --no-fund

      - name: Publish CLI
        if: steps.gate.outputs.configured == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm --prefix cli run build
            ( cd cli && npm publish --dry-run --access public )
          else
            npm run cli:publish
          fi
